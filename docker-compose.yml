services:
  api:
    build: .
    container_name: api
    command: bash -c "cd /src/rest && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    volumes:
      - ./src/tmp:/tmp
      - ./src:/src

  app:
    build: .
    container_name: app
    command: bash -c "cd /src/app && yarn install --frozen-lockfile && yarn start"
    ports:
      - "3000:3000"
    volumes:
      - ./src:/src

  mongo:
    image: mongo:4.4
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./src/db:/data/db
    command: /usr/bin/mongod --bind_ip 0.0.0.0

    